# Replace the hostname and certificate paths with the actual TLS configuration.
server {
    listen 443 ssl;
    server_name radar.example.com;
    ssl_certificate /etc/letsencrypt/live/radar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.example.com/privkey.pem;

    location = /hooks/helius {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:9012;
        proxy_set_header Authorization $http_authorization;
    }

    location = /web {
        proxy_pass http://127.0.0.1:9011;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /web/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:9011;
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/agent-dorm/status {
        proxy_pass http://127.0.0.1:9011;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        return 404;
    }
}
